<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VALAX">
  <!-- Favicon: the VALAX mark (see logo.svg) on a navy tile, so it stays
       visible on both light and dark browser tabs. -->
  <defs>
    <path id="bullet" d="M23,28.5 H40 C46,28.5 50,31 51.5,32 C50,33 46,35.5 40,35.5 H23 Z"/>
    <path id="v-left" d="M14.9,12 L22.9,12 L30.5,42.1 L25.5,54 Z"/>
    <mask id="behind-left" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#v-left" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    </mask>
    <mask id="in-front-right" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#bullet" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      <rect width="31.5" height="64" fill="#fff"/>
    </mask>
    <mask id="groove" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <line x1="38" y1="27" x2="38" y2="37" stroke="#000" stroke-width="1.2"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="12" fill="#1b3a6b"/>

  <g fill="#ffffff" mask="url(#in-front-right)">
    <path d="M14.9,12 L25.5,54 L51.9,12 L49.4,12 L30.5,42.1 L22.9,12 Z"/>
    <rect x="11" y="10" width="16" height="2"/>
    <rect x="46" y="10" width="10" height="2"/>
  </g>

  <g mask="url(#behind-left)">
    <use href="#bullet" fill="#ffc107" mask="url(#groove)"/>
    <g stroke="#ffc107" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
      <line x1="9" y1="29.5" x2="20" y2="29.5"/>
      <line x1="4" y1="32" x2="20" y2="32"/>
      <line x1="11" y1="34.5" x2="20" y2="34.5"/>
    </g>
  </g>
</svg>
