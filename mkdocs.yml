site_name: VALAX
site_description: JAX-native quantitative finance valuation engine
site_url: https://acea15.github.io/VALAX/
repo_url: https://github.com/ACea15/VALAX
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg        # italic V pierced by a bullet ("vala")
  # PNG, not SVG: Safari ignores SVG favicons. Regenerate from the SVG source with
  #   rsvg-convert -w 64 -h 64 docs/assets/favicon.svg -o docs/assets/favicon.png
  favicon: assets/favicon.png  # same mark on a navy tile
  palette:
    - scheme: slate
      primary: custom  # navy, defined in docs/stylesheets/extra.css
      accent: amber
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes  # a section's index.md is its clickable parent page
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: true             # (optional; also the mkdocstrings default)
            heading_level: 3
            members_order: source
            filters:
              - "!^_"

watch:
  - valax

# Nested sections stay collapsed until clicked (no navigation.expand). A section
# whose first entry is an index.md shows only that parent page; its children
# appear when it is opened (navigation.indexes).
