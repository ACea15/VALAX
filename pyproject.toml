[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valax"
version = "0.1.0"
description = "JAX-native quantitative finance valuation engine"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "jax[cpu]",
    "equinox",
    "diffrax",
    "optimistix",
    "optax",
    "lineax",
    "jaxtyping",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "hypothesis",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
# Holiday reference data, consulted *offline* by
# scripts/generate_holiday_tables.py and by the regeneration test in
# tests/test_dates/test_calendars.py.  Deliberately not a runtime
# dependency: holiday dates are reference data, so the tables are
# version-stamped and checked in rather than rebuilt from whichever
# upstream version happens to be installed.  See valax/dates/_holiday_data.py.
calendars-data = [
    "holidays",
    "pandas-market-calendars",
]

[tool.hatch.build.targets.wheel]
packages = ["valax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "arbitrage: tests that inject deliberate static-arbitrage data and assert detect-or-regularise behaviour.",
    "golden: tests that compare against a versioned golden dataset under tests/golden/.",
    "detects: tests that the library currently *passes* (as opposed to xfail roadmap items).",
    "audit: conformance gates for the multi-curve calibration / AAD risk audit specification (the T-suite). Run with `pytest -m audit`; each test names the requirement it verifies and states its tolerance.",
]
